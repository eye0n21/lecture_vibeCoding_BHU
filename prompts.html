<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프롬프트 — 바이브코딩 허브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="hub.css">
</head>
<body>

<main class="wrap">

<section id="prompts">
  <div class="kicker">프롬프트</div>
  <h2>복사해서 쓰는 지시문 — <span style="background:#fff3c4;border-radius:4px;padding:0 6px">노란 칸</span>만 바꾸세요</h2>
  <div class="grid g2" id="promptGrid"></div>
  <div class="note" style="margin-top:16px">수정 요청 공식: [무엇이 달랐다] + [어느 부분을] + [어떻게 바꿔라] + [나머지는 그대로]. “이상해”, “별로야”, “예쁘게”는 지시가 아닙니다.</div>
</section>

</main>

<script src="hub.js"></script>
</body>
</html>
