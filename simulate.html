<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진행 미리보기 — 바이브코딩 허브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="hub.css">
<style>
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chips button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.chips button.done{color:var(--green-d);border-color:#bfe9d9}
.chips button.on{background:var(--green);border-color:var(--green);color:#fff}
.sim{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.pane{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pane-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-2);background:var(--bg)}
.chat{height:560px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.msg{font-size:15px;line-height:1.65}
.msg.user{align-self:flex-end;max-width:88%;background:var(--purple-bg);border-radius:12px 12px 2px 12px;padding:10px 14px}
.msg.ai{padding:2px 2px 2px 18px;position:relative}
.msg.ai::before{content:"";position:absolute;left:2px;top:9px;width:8px;height:8px;border-radius:50%;background:#d97757}
.msg.tool{font-family:ui-monospace,Consolas,"D2Coding",monospace;font-size:13px;color:var(--ink-2);padding-left:18px;position:relative}
.msg.tool::before{content:"";position:absolute;left:2px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--green)}
.msg.tool b{color:var(--ink)}
.msg ol,.msg ul{margin:4px 0;padding-left:22px}
.msg li{margin:2px 0}
.msg table{font-size:14px;margin:6px 0}
.msg th,.msg td{padding:6px 8px}
.msg .sum{border-left:3px solid var(--green);background:var(--green-bg);padding:6px 10px;border-radius:0 8px 8px 0;margin-top:6px;font-size:14px}
.msg.new{animation:pop .35s ease both}
.msg.old{opacity:.6}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.msg.new{animation:none}}
.ctrl{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.ctrl button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.ctrl button.pri{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.ctrl button:disabled{opacity:.4;cursor:default}
.ctrl .cnt{margin-left:auto;font-size:13px;color:var(--ink-2)}
.tree{list-style:none;margin:0;padding:8px 0;font-size:14px}
.tree li{display:flex;align-items:center;gap:8px;padding:5px 14px;margin:0;cursor:pointer}
.tree li:hover{background:var(--bg)}
.tree li.sel{background:var(--green-bg)}
.tree li.dir{cursor:default;color:var(--ink-2)}
.tree li .tag{margin-left:auto;font-size:11px;font-weight:800;border-radius:4px;padding:1px 6px}
.tree li .tag.u{color:#fff;background:var(--green)}
.tree li .tag.r{color:var(--purple-d);background:var(--purple-bg)}
.tree li .tag.s{color:#9a3412;background:#ffedd5}
.tree li.new{color:var(--green-d);font-weight:700;animation:pop .35s ease both}
.preview{margin:0;padding:14px;height:330px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,Consolas,"D2Coding",monospace;font-size:12.5px;line-height:1.6;border-top:1px solid var(--line);background:#fcfcfb}
.tip{margin-top:14px}
.tip b{display:block;margin-bottom:2px}
@media (max-width:860px){.sim{grid-template-columns:1fr}.chat{height:460px}.preview{height:260px}}
</style>
</head>
<body>

<main class="wrap">

<section id="simulate">
  <div class="kicker">진행 미리보기 · 샘플 「오늘약」</div>
  <h2>첫 문장부터 설계 확정, 뼈대까지</h2>
  <p class="lead">스타터 킷의 CLAUDE.md를 읽은 Claude Code가 실제로 진행하는 순서입니다. <b>다음</b>을 눌러 한 단계씩 보세요. 옆의 탐색기(휴대폰에서는 아래)에서 어떤 파일을 읽고, 기획서.md가 언제 채워지는지 확인할 수 있습니다.</p>
  <div class="chips" id="chips"></div>
  <div class="sim">
    <div class="pane">
      <div class="pane-h">Claude Code · 약손_오늘약</div>
      <div class="chat" id="chat"></div>
      <div class="ctrl"><button id="first">처음</button><button id="prev">◀ 이전</button><button class="pri" id="next">다음 ▶</button><span class="cnt" id="cnt"></span></div>
    </div>
    <div class="pane">
      <div class="pane-h">탐색기 · 약손_오늘약</div>
      <ul class="tree" id="tree"></ul>
      <pre class="preview" id="preview"></pre>
    </div>
  </div>
  <div class="note tip" id="tip"></div>
</section>

</main>

<script src="hub.js"></script>

시각 규칙만 적습니다. 내용은 기획서.md를 따릅니다.

'index.html':`<!DOCTYPE html>

const PLAN_HEAD=`# 기획서.md — 우리 팀 페이지 기획서

우리 팀 페이지의 내용이 이 파일 하나에 모입니다.
색·글꼴 같은 디자인 규칙은 DESIGN.md에 따로 둡니다.
`;
const PLAN={
 '0a':[`- 문제정의문 →`,`- 문제정의문 → 부산 사하구에 혼자 사는 70대 어르신은 병원 여러 곳에서 받은 약을 매일 챙겨 먹어야 하는 상황에서 병원마다 약봉투와 복용 안내가 달라 무엇을 언제 먹는지 한눈에 볼 수 없어 약을 거르거나 두 번 먹는 불편을 경험하고 있으며, 이를 해결하기 위해 오늘 먹을 약을 시간대별로 한 화면에서 확인하고 먹었는지를 가족과 함께 볼 수 있는 변화가 필요하다`],
 '0b':[`- 결과물 유형 →`,`- 결과물 유형 → (다) 소개 + 시연`],
 '1':[`- 조이름 →
- 아이템 이름 →
- 한 줄 소개 →`,`- 조이름 → 약손
- 아이템 이름 → 오늘약
- 한 줄 소개 → 약봉투 사진 한 장으로 오늘 먹을 약을 정리하고, 먹었는지 가족이 함께 확인하는 서비스`],
 '2':[`- 주 사용자 →
- 함께 쓰는 사람 →
- 가장 큰 불편 1 →
- 가장 큰 불편 2 →
- 지금은 어떻게 버티고, 왜 부족한가 →
- 그 사람의 실제 말 한 문장 →`,`- 주 사용자 → 사하구에 혼자 사는 70대 어르신 (병원 2~3곳, 약 5~6종)
- 함께 쓰는 사람 → 서울 사는 딸
- 가장 큰 불편 1 → 병원마다 약봉투가 달라 무엇을 언제 먹는지 헷갈림
- 가장 큰 불편 2 → 약을 거르거나 두 번 먹음
- 지금은 어떻게 버티고, 왜 부족한가 → 딸이 매일 전화로 묻지만 어르신도 기억에 기댈 수밖에 없음
- 그 사람의 실제 말 한 문장 → "약이 여섯 가지인데, 아침에 뭘 먹었는지 저녁이면 기억이 안 나요."`],
 '3':[`| 번호 | 기능 이름 | 누가 쓰나 | 무엇을 누르거나 적나 | 그러면 화면에 무엇이 보이나 | 구분 |
|---|---|---|---|---|---|
| 1 | 약 등록 | 어르신 + 약사 | 약 이름을 적고 아침/점심/저녁 선택 | 약 목록에 한 줄 추가됨 | 필수 |
| 2 | ★ 오늘 복약 체크 | 어르신 | 아침·점심·저녁 버튼 중 하나를 누름 | 그 칸에 도장이 찍히고 "오늘 2번 드셨어요" | 필수 |
| 3 | 가족 공유 | 딸 | "가족 보기"를 누름 | 오늘 복약 상태가 그대로 보임 | 있으면 좋음 |
| 4 | 약국 문자 보내기 | 어르신 | "약 떨어짐"을 누름 | "문자를 보냈어요" 화면만 | 흉내 |
| 5 |  |  |  |  |  |
`],
 '3b':[`- 오늘 실제로 눌러 보여줄 기능 (★) →
- 운영 주체 →
- 기대효과 한 줄 →`,`- 오늘 실제로 눌러 보여줄 기능 (★) → 2번 오늘 복약 체크
- 운영 주체 → 동네 약국(첫 등록 도움) + 구 보건소(방문간호 때 확인)
- 기대효과 한 줄 → 복약 누락을 줄이고, 자녀의 전화 확인 부담을 덜어 줌`],
 '4':[`- 단일 페이지 / 멀티 페이지 중 →
- 들어갈 섹션 또는 페이지 →`,`- 단일 페이지 / 멀티 페이지 중 → 멀티 페이지
- 들어갈 섹션 또는 페이지 → index(소개) · feature(기능, 김순자 어르신의 하루) · demo(시연) · team(팀)`],
 '5':[`- 사용자가 무엇을 누르거나 입력하면 →
- 화면에 무엇이 나타나는지 →
- 그다음 무엇을 누르면 →
- 화면에 보일 가짜 데이터 →`,`- 사용자가 무엇을 누르거나 입력하면 → 약 등록에서 "약 추가"로 한 줄 붙이기

 '6':[`- 방식 →
- 이 아이템을 떠올리면 생각나는 물건·장소·색 →
- 다른 팀과 달라 보이는 한 가지 →

- 꼭 피하고 싶은 것 → 병원 홈페이지처럼 메뉴가 많은 것, 작은 글씨`],
};
function planText(filled,status){
  const p=k=>PLAN[k][filled.includes(k)&&PLAN[k].length>1?1:0];

${p('0a')}

## 1. 팀과 아이템

${p('3')}
${p('3b')}

${p('4')}

## 5. 시연 장면
${p('5')}

## 6. 디자인 방향 (색·글꼴은 DESIGN.md에)
${p('6')}`;
}

  tip:['새 프롬프트 없이 이어집니다','이후 순서: 소개 → 문제와 대상 → 기능 소개 → 시연 기능 → 팀 소개 → 다듬기. 학생은 열어 보고 "확인했어" 또는 고칠 점만 말하면 됩니다. <a href="guide.html#s2">2 뼈대 생성</a>으로.']},
];

// ---- 렌더 ----
let cur=0,sel=null;
const chat=$('chat'),tree=$('tree'),pv=$('preview');
function fileText(f){
  if(f!=='기획서.md')return FILES[f]||'';
  const done=SIM.slice(0,cur+1);
  const st=done.map(x=>x.st).filter(Boolean).pop()||'작성 전';
  return planText(done.flatMap(x=>x.fill||[]),st);
}
function show(f){sel=f;pv.textContent=fileText(f);tree.querySelectorAll('li[data-f]').forEach(li=>li.classList.toggle('sel',li.dataset.f===f));}
function draw(){
  const s=SIM[cur];
  $('chips').innerHTML=SIM.map((x,i)=>`<button data-i="${i}" class="${i===cur?'on':i<cur?'done':''}">${x.n}</button>`).join('');
  chat.innerHTML='';let firstNew=null;
  SIM.slice(0,cur+1).forEach((x,i)=>x.msgs.forEach(([r,h])=>{const el=document.createElement('div');el.className=`msg ${r} ${i===cur?'new':'old'}`;el.innerHTML=h;chat.appendChild(el);if(i===cur&&!firstNew)firstNew=el;}));
  chat.scrollTop=firstNew?firstNew.offsetTop-8:0;
  const added=SIM.slice(0,cur+1).flatMap(x=>x.add||[]);
  const files=[...added.slice().reverse(),...BASE];
  tree.innerHTML=files.map(f=>{const dir=f.endsWith('/');const isNew=added.includes(f);const tag=isNew?'<span class="tag u">U</span>':(s.save||[]).includes(f)?'<span class="tag s">저장</span>':(s.read||[]).includes(f)?'<span class="tag r">읽음</span>':'';
    return `<li ${dir?'class="dir"':`data-f="${f}"`}${isNew&&(s.add||[]).includes(f)?' class="new"':''}>${dir?'▸ ':''}${f}${tag}</li>`;}).join('');
  show(s.open||(sel&&(added.includes(sel)||BASE.includes(sel))?sel:'CLAUDE.md'));
  $('tip').innerHTML=`<b>${s.tip[0]}</b>${s.tip[1]}`;
  $('cnt').textContent=`${cur+1} / ${SIM.length}`;
  $('prev').disabled=$('first').disabled=cur===0;$('next').disabled=cur===SIM.length-1;
}
function go(i){cur=Math.max(0,Math.min(SIM.length-1,i));draw();}
$('next').onclick=()=>go(cur+1);$('prev').onclick=()=>go(cur-1);$('first').onclick=()=>go(0);
$('chips').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i);};
tree.onclick=e=>{const li=e.target.closest('li[data-f]');if(li)show(li.dataset.f);};
draw();
</script>
